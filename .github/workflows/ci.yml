name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: journals
          POSTGRES_PASSWORD: journals
          POSTGRES_DB: journals_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U journals"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JOURNALS_TEST_DATABASE_URL: postgresql+asyncpg://journals:journals@localhost:5432/journals_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Системные библиотеки для WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q
