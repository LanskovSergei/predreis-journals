name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # по понедельникам: аудит зависимостей и полный прогон

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: journals
          POSTGRES_PASSWORD: journals
          POSTGRES_DB: journals_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U journals"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JOURNALS_TEST_DATABASE_URL: postgresql+asyncpg://journals:journals@localhost:5432/journals_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q

  e2e:
    # Сквозная проверка на настоящих процессах (подставной ПРЕДРЕЙС, RabbitMQ, Redis).
    # Не блокирует слияние, пока не отлажена на GitHub: `continue-on-error`.
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: journals
          POSTGRES_PASSWORD: journals
          POSTGRES_DB: journals_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U journals"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:3.12
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      JOURNALS_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --no-deps -e .
      - run: pytest tests/e2e -q

  audit:
    # Известные уязвимости в зафиксированных зависимостях. Не блокирует слияние: новые уведомления
    # появляются независимо от наших изменений; результат смотрите во вкладке Actions.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --require-hashes -r requirements.txt

