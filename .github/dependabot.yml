# Еженедельные обновления: зависимости Python (requirements*.txt и pyproject.toml), действия GitHub и образ Docker.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # redis не прямая зависимость: его версию задаёт arq (сейчас redis<6). Обновление вручную ломает воркер.
      - dependency-name: redis
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
