# Электронные журналы на домене платформы: https://<домен платформы>/journals/...
# Подключить внутри server { } HTTPS-домена платформенного nginx (контейнер predreis_nginx), перед location / {.
# ВАЖНО: если nginx.conf подключён в контейнер отдельным файлом, правьте его с сохранением inode
# (cat новое > файл), а не sed -i или редактором с заменой файла: иначе контейнер продолжит видеть старый файл.
#
# Адреса заданы через переменные и resolver: так nginx НЕ упадёт при запуске или перезагрузке, если журналы
# в этот момент остановлены (иначе «host not found in upstream» уронил бы всю платформу).
#
# Только префиксы (^~) и точные совпадения (=), без регулярных выражений: при ^~ nginx не смотрит регулярные
# выражения, поэтому маршрут не перехватит ни блок платформы, ни соседний блок журналов.
#   /journals/api/...  /journals/docs  /journals/openapi.json  /journals/health  /journals/ready → journals_api:8000
#   /journals/... (остальное)                                                                     → journals_frontend:80

location = /journals {
    return 301 /journals/;
}

# Метрики Prometheus отдаём только внутри сервера (мониторинг ходит напрямую на journals_api:8000/metrics).
location ^~ /journals/metrics {
    return 404;
}

location ^~ /journals/api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;  # встроенный DNS Docker
    set $journals_upstream http://journals_api:8000;
    rewrite ^/journals/(.*)$ /$1 break;  # префикс срезается (uvicorn --root-path=/journals)
    proxy_pass $journals_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header X-Request-ID $request_id;
    client_max_body_size 12m;  # загрузка сканов для распознавания
    proxy_read_timeout 120s;   # крупная PDF-выгрузка
}

location = /journals/docs {
    resolver 127.0.0.11 valid=30s ipv6=off;  # встроенный DNS Docker
    set $journals_upstream http://journals_api:8000;
    rewrite ^/journals/(.*)$ /$1 break;  # префикс срезается (uvicorn --root-path=/journals)
    proxy_pass $journals_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /journals/openapi.json {
    resolver 127.0.0.11 valid=30s ipv6=off;  # встроенный DNS Docker
    set $journals_upstream http://journals_api:8000;
    rewrite ^/journals/(.*)$ /$1 break;  # префикс срезается (uvicorn --root-path=/journals)
    proxy_pass $journals_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /journals/health {
    resolver 127.0.0.11 valid=30s ipv6=off;  # встроенный DNS Docker
    set $journals_upstream http://journals_api:8000;
    rewrite ^/journals/(.*)$ /$1 break;  # префикс срезается (uvicorn --root-path=/journals)
    proxy_pass $journals_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /journals/ready {
    resolver 127.0.0.11 valid=30s ipv6=off;  # встроенный DNS Docker
    set $journals_upstream http://journals_api:8000;
    rewrite ^/journals/(.*)$ /$1 break;  # префикс срезается (uvicorn --root-path=/journals)
    proxy_pass $journals_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Приложение журналов (статика): путь передаётся как есть
location ^~ /journals/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $journals_frontend http://journals_frontend:80;
    proxy_pass $journals_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
