# Электронные журналы на домене платформы: https://predreis-online.ru/journals/...
# Подключить внутри server { } платформенного nginx (контейнер predreis_nginx) через include или вставкой.
# Контейнер nginx уже в сети predreis_net, туда же подключён journals_api.
#
# Адрес задан через переменную и resolver: так nginx НЕ упадёт при запуске или перезагрузке, если журналы
# в этот момент остановлены (иначе «host not found in upstream» уронил бы всю платформу).

location = /journals {
    return 301 /journals/;
}

# Метрики Prometheus отдаём только внутри сервера (мониторинг ходит напрямую на journals_api:8000/metrics).
location ^~ /journals/metrics {
    return 404;
}

location ^~ /journals/ {
    resolver 127.0.0.11 valid=30s ipv6=off;  # встроенный DNS Docker
    set $journals_upstream http://journals_api:8000;
    rewrite ^/journals/(.*)$ /$1 break;  # приложение работает без префикса (uvicorn --root-path=/journals)
    proxy_pass $journals_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    client_max_body_size 12m;  # загрузка сканов для распознавания
    proxy_read_timeout 120s;   # крупная PDF-выгрузка
}
