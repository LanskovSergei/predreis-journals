# Обратный прокси nginx (если вместо Caddy). TLS-сертификат получите, например, через certbot.
# Замените journals.example.ru и пути к сертификату. Проверка: nginx -t  (в моей среде nginx не было, файл не проверялся)

# Общая защита от перебора: на вход не более 10 запросов в минуту с адреса (помимо защиты в приложении)
limit_req_zone $binary_remote_addr zone=journals_login:10m rate=10r/m;

server {
    listen 80;
    server_name journals.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name journals.example.ru;

    ssl_certificate     /etc/letsencrypt/live/journals.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/journals.example.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    client_max_body_size 12m;
    gzip on;
    gzip_types application/json text/plain;

    # Метрики только изнутри
    location /metrics {
        return 404;
    }

    location = /api/v1/auth/login {
        limit_req zone=journals_login burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;  # выгрузки PDF и просмотр журнала
    }
}

# /etc/nginx/proxy_params (если файла нет) должен содержать как минимум:
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
