# Раздача приложения журналов внутри контейнера journals_frontend. Снаружи сюда ходит только
# nginx платформы (location /journals/ без срезания префикса).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location = /journals {
        return 301 /journals/;
    }

    # Файлы сборки с хешем в имени — можно кэшировать надолго
    location /journals/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Любой путь приложения отдаёт index.html (маршрутизацию делает само приложение)
    location /journals/ {
        try_files $uri /journals/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
